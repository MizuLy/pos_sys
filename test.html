<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Language Switch Demo</title>
    <style>
      body {
        font-family: sans-serif;
        max-width: 500px;
        margin: 50px auto;
        text-align: center;
      }
      button {
        padding: 8px 16px;
        margin: 5px;
        cursor: pointer;
      }
      h1 {
        color: #333;
      }
    </style>
  </head>
  <body>
    <h1 data-i18n="welcome">Welcome</h1>
    <p data-i18n="description">This is a demo page.</p>
    <button data-i18n="login">Log In</button>
    <button data-i18n="cart">Cart</button>

    <hr />
    <button onclick="switchLanguage('en')">English</button>
    <button onclick="switchLanguage('kh')">ភាសាខ្មែរ</button>
    <button onclick="switchLanguage('fr')">Français</button>

    <script>
      // Step 1: store all text here, one object per language
      const translations = {
        en: {
          welcome: "Welcome",
          description: "This is a demo page.",
          login: "Log In",
          cart: "Cart",
        },
        kh: {
          welcome: "សូមស្វាគមន៍",
          description: "នេះជាទំព័រសាកល្បង។",
          login: "ចូលគណនី",
          cart: "កន្ត្រក",
        },
        fr: {
          welcome: "Bienvenue",
          description: "Ceci est une page de démonstration.",
          login: "Connexion",
          cart: "Panier",
        },
      };

      // Step 2: find every element with data-i18n and update its text
      function switchLanguage(lang) {
        document.querySelectorAll("[data-i18n]").forEach((el) => {
          const key = el.getAttribute("data-i18n");
          el.textContent = translations[lang][key];
        });
      }
    </script>
  </body>
</html>
